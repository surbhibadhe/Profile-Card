<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Profile Card</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- DARK MODE BUTTON -->

    <button class="theme-toggle" id="themeBtn">

        <i class="fa-solid fa-moon"></i>

    </button>

    <div class="container">

        <div class="profile-card">

            <!-- LEFT SECTION -->

            <div class="left-section">

                <img src="images/MyImg.png" alt="Profile Picture" class="profile-pic">

                <h1>Surbhi Badhe</h1>

                <p class="role">
                    Frontend Learner
                </p>

                <!-- SOCIAL ICONS -->

                <div class="social-icons">

                    <a href="https://github.com/surbhibadhe" target="_blank">

                        <i class="fa-brands fa-github"></i>

                    </a>

                    <a href="https://x.com/surbhi_badhe03" target="_blank">

                        <i class="fa-brands fa-x-twitter"></i>

                    </a>

                    <a href="https://www.linkedin.com/in/surbhi-badhe-901263377/" target="_blank">

                        <i class="fa-brands fa-linkedin"></i>

                    </a>

                </div>

                <!-- BUTTONS -->

                <div class="buttons">

                    <button class="follow-btn">
                        Follow
                    </button>

                    <button class="message-btn" id="messageBtn">
                        Message
                    </button>

                </div>

            </div>

            <!-- RIGHT SECTION -->

            <div class="right-section">

                <div class="stat-box">

                    <h2>HTML</h2>

                    <p>Structure</p>

                </div>

                <div class="stat-box">

                    <h2>CSS</h2>

                    <p>Styling</p>

                </div>

                <div class="stat-box">

                    <h2>JS</h2>

                    <p>Learning</p>

                </div>

            </div>

        </div>

    </div>

    <!-- MESSAGE POPUP -->

    <div class="popup" id="popup">

        <div class="popup-box">

            <h2>Send Message</h2>

            <textarea placeholder="Type your message..."></textarea>

            <button class="send-btn">
                Send
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
