<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Card</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <div class="container">

        <div class="profile-card">

            <!-- Top Section -->

                <img src="images/MyImg.png" class="profile-pic" alt="Profile Picture">

                <h1>Surbhi Badhe</h1>

            </div>

            <!-- Bottom Section -->

                <p>
                    Currently pursuing a Bachelor of Technology in Computer Science Engineering at DES Pune University.
                </p>

                <div class="social-icons">

                    <a href="https://www.linkedin.com/in/surbhi-badhe-901263377/" target="_blank">

                        <img src="images/linkedin.png" alt="LinkedIn">

                    </a>

                    <a href="https://x.com/surbhi_badhe03" target="_blank">

                        <img src="images/twitter.png" alt="Twitter">

                    </a>

                    <a href="https://github.com/surbhibadhe" target="_blank">

                        <img src="images/github.png" alt="GitHub">

                    </a>

                </div>

            </div>

        </div>

    </div>

</html>
