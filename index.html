<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Profile Card</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="profile-card">

            <!-- LEFT SIDE -->

            <div class="left-section">

                <img src="images/MyImg.png" alt="Profile Picture" class="profile-pic">

                <h1>Surbhi Badhe</h1>

                <p class="role">
                    Frontend Developer
                </p>

                <div class="buttons">

                    <button class="follow-btn">
                        Follow
                    </button>

                    <button class="message-btn">
                        Message
                    </button>

                </div>

            </div>

            <!-- RIGHT SIDE -->

            <div class="right-section">

                <div class="stat-box">

                    <h2>523</h2>

                    <p>Posts</p>

                </div>

                <div class="stat-box">

                    <h2>1387</h2>

                    <p>Likes</p>

                </div>

                <div class="stat-box">

                    <h2>146</h2>

                    <p>Followers</p>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
